<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="app-version" content="1.24">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324D">
<meta name="description" content="Ημερολόγιο ραντεβού για κάθε επάγγελμα: πάγια ραντεβού, ελεύθερα κενά, προσωπικό, υπενθυμίσεις.">
<title>Ημερολόγιο</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap&subset=greek" rel="stylesheet">
<style>
/* LUMIO — σταθερό πλαϊνό μενού + σελίδες με κάρτες· απαλό παστέλ σε κρεμ βάση */
:root{
  --cream:#FAF6EF;--paper:#FFFFFF;--field:#FFFFFF;--raise:#FDFBF7;
  --ink:#2E2A33;--ink2:#6B6573;--ink3:#9C95A5;--on-ink:#FFFFFF;
  --line:#ECE5DA;--line2:#F3EEE6;
  --yellow:#F8E7AE;--yellow-d:#B98A1E;--lilac:#E9E2F7;--lilac-d:#7462B4;--pink:#F9E0E8;--pink-d:#C0627F;
  --peach:#FCE6D6;--peach-d:#C77A4E;--blue:#DFEBF8;--blue-d:#4E7FB8;--mint:#DFF1E6;--mint-d:#3A8A61;
  --ok:#3A8A61;--bad:#C2524A;--warn:#B98A1E;--badbg:#FBE4E1;
  --sh:0 1px 2px rgba(46,42,51,.04),0 8px 28px rgba(46,42,51,.06);
  --font:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --head:"Literata",Georgia,"Times New Roman",serif;
  --side:256px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cream:#16141B;--paper:#1F1C25;--field:#262230;--raise:#24212B;
  --ink:#EEEAF3;--ink2:#B3ABBD;--ink3:#857D90;--on-ink:#16141B;
  --line:#322D3B;--line2:#2A2632;
  --yellow:#3A3120;--yellow-d:#E7C46A;--lilac:#2E2846;--lilac-d:#B8A8F2;--pink:#3B2530;--pink-d:#EE9DB5;
  --peach:#3B2B21;--peach-d:#F0AE86;--blue:#1E2B3C;--blue-d:#8EB6E8;--mint:#1D3227;--mint-d:#7FCFA3;
  --ok:#7FCFA3;--bad:#F08A80;--warn:#E7C46A;--badbg:#3D2224;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --cream:#16141B;--paper:#1F1C25;--field:#262230;--raise:#24212B;
  --ink:#EEEAF3;--ink2:#B3ABBD;--ink3:#857D90;--on-ink:#16141B;
  --line:#322D3B;--line2:#2A2632;
  --yellow:#3A3120;--yellow-d:#E7C46A;--lilac:#2E2846;--lilac-d:#B8A8F2;--pink:#3B2530;--pink-d:#EE9DB5;
  --peach:#3B2B21;--peach-d:#F0AE86;--blue:#1E2B3C;--blue-d:#8EB6E8;--mint:#1D3227;--mint-d:#7FCFA3;
  --ok:#7FCFA3;--bad:#F08A80;--warn:#E7C46A;--badbg:#3D2224;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lilac-d)}
h1,h2,h3{font-family:var(--head);font-weight:600;letter-spacing:-.01em;margin:0 0 .4em;text-wrap:balance}
h1{font-size:1.65rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
.muted{color:var(--ink2)}.small{font-size:.86rem}.tiny{font-size:.76rem}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--lilac-d);outline-offset:2px}
.ic{display:inline-block;vertical-align:middle;flex:none}
.icw{display:inline-flex;margin-right:7px;vertical-align:-3px}
.btn .icw{margin-right:0}

/* ===== κέλυφος ===== */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{background:var(--paper);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:16px 12px 12px;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;text-decoration:none;color:var(--ink)}
.brand svg{width:38px;height:38px;flex:none;border-radius:11px}
.brand b{font-family:var(--head);font-size:1.18rem;letter-spacing:.12em;display:block;line-height:1.1}
.brand span{font-size:.7rem;color:var(--ink2);display:block}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-h{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);padding:16px 12px 6px;font-weight:600}
.nav a,.nav button.navx{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:.92rem;border:0;background:transparent;width:100%;text-align:left;cursor:pointer}
.nav a .ic,.nav .navx .ic{color:var(--ink3)}
.nav a:hover,.nav .navx:hover{background:var(--line2);color:var(--ink)}
.nav a.on{background:var(--lilac);color:var(--ink);font-weight:600}
.nav a.on .ic{color:var(--lilac-d)}
.nav .navx .chev{margin-left:auto;transition:transform .2s}
.nav .navx.open .chev{transform:rotate(180deg)}
.nav .navx.on{color:var(--ink);font-weight:600}
.nav .sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 4px 22px;padding-left:12px;border-left:1px solid var(--line)}
.nav .sub a{padding:6px 10px;font-size:.86rem}
.nav .sub a.on{background:transparent;color:var(--lilac-d);font-weight:600}
.side-foot{margin-top:auto;padding:12px 4px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.side-foot>div{flex:1;min-width:0}
.side-foot b{display:block;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot span{font-size:.72rem;color:var(--ink2)}
.meav{width:34px;height:34px;border-radius:50%;background:var(--lilac);display:grid;place-items:center;font-weight:700;color:var(--lilac-d);flex:none;text-decoration:none}
.meav.lg{width:52px;height:52px;font-size:1.3rem}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--ink2);cursor:pointer;text-decoration:none;flex:none}
.iconbtn:hover{background:var(--line2);color:var(--ink)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--pink-d)}
.shell{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;height:60px;padding:0 clamp(16px,3vw,36px);background:color-mix(in srgb,var(--cream) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .burger,.topbar .tlogo{display:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--ink2);white-space:nowrap;overflow:hidden}
.crumbs a{color:var(--ink2);text-decoration:none}.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumbs .ic{color:var(--ink3)}
.main{width:100%;max-width:1180px;margin:0 auto;padding:28px clamp(16px,3vw,36px) 72px}
.bottomnav,.drawer-ov{display:none}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.18);padding-top:calc(16px + env(safe-area-inset-top,0px))}
  body.drawer .side{transform:none}
  body.drawer .drawer-ov{display:block;position:fixed;inset:0;background:rgba(20,18,25,.35);z-index:55}
  .topbar{height:auto;min-height:56px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px}
  .topbar .burger{display:inline-grid}
  .crumbs{font-size:1rem}.crumbs .cpath{display:none}.crumbs b{font-family:var(--head);font-size:1.08rem}
  .main{padding:18px 16px 104px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink3);font-size:.66rem;font-weight:500;cursor:pointer}
  .bottomnav .bi{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:.15s}
  .bottomnav a.on{color:var(--ink)}
  .bottomnav a.on .bi{background:var(--lilac);color:var(--lilac-d)}
  .bottomnav a.mid .bi{background:var(--ink);color:var(--on-ink);width:46px;height:46px;border-radius:50%;margin-top:-20px;box-shadow:0 6px 16px rgba(46,42,51,.25)}
}

/* ===== σελίδα ===== */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head>div:first-child{min-width:0}
.page-head h1{margin:0}
.page-head .sub{color:var(--ink2);margin-top:4px;font-size:.92rem}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:.76rem;color:var(--ink2);letter-spacing:.03em;margin-bottom:2px}
.section{margin-bottom:26px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 10px}
.section-h h2{font-family:var(--font);font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);font-weight:600;margin:0}
.section-h a,.section-h button{font-size:.84rem;color:var(--lilac-d);text-decoration:none;background:none;border:0;cursor:pointer}
.tabs{display:flex;gap:4px;box-shadow:inset 0 -1px 0 var(--line);margin-bottom:22px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{padding:10px 14px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:.9rem;border:0;background:none;box-shadow:inset 0 -2px 0 transparent;margin:0;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;line-height:1.3}
.tabs a:hover,.tabs button:hover{color:var(--ink)}
.tabs a.on,.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--lilac-d);font-weight:600}
.seg{display:inline-flex;gap:3px;background:var(--line2);padding:3px;border-radius:11px;max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg>*{flex:0 0 auto}
.seg a,.seg button{padding:6px 13px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:.85rem;font-weight:500;white-space:nowrap;border:0;background:none;cursor:pointer}
.seg .on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:960px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:960px){.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.kpis,.kpis.k3,.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink);display:block;min-width:0}
a.kpi:hover{border-color:var(--lilac-d)}
.kpi .k{font-size:.78rem;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--head);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:.76rem;color:var(--ink3)}
.kpi .v.sm{font-size:1.15rem}
/* γραμμές λίστας */
.list{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rw{display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;border-bottom:1px solid var(--line2);background:transparent;width:100%;text-align:left;color:var(--ink);text-decoration:none;font:inherit;cursor:pointer;min-height:58px}
.rw:last-child{border-bottom:0}
.rw:hover{background:var(--raise)}
.rw>.ic:last-child{color:var(--ink3)}
.rw .grow{flex:1;min-width:0}
.rw b{display:block;font-weight:600;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw small{display:block;color:var(--ink2);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw.static{cursor:default}.rw.static:hover{background:transparent}
.rw.danger,.rw.danger .ricon{color:var(--bad)}
.rw .av{width:40px;height:40px;border-radius:12px;font-size:1.2rem}
.rw .end{display:flex;gap:6px;align-items:center;flex:none}
.ricon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--line2);color:var(--ink2);flex:none}
.ricon.l{background:var(--lilac);color:var(--lilac-d)}.ricon.b{background:var(--blue);color:var(--blue-d)}.ricon.p{background:var(--pink);color:var(--pink-d)}.ricon.pe{background:var(--peach);color:var(--peach-d)}.ricon.y{background:var(--yellow);color:var(--yellow-d)}.ricon.g{background:var(--mint);color:var(--mint-d)}.ricon.r{background:var(--pink);color:var(--pink-d)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;flex:none;background:var(--lilac)}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
.pct.g{color:var(--ok)}.pct.y{color:var(--warn)}.pct.r{color:var(--bad)}
.bar{height:7px;border-radius:9px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--lilac-d)}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty .e{color:var(--ink3);margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}
/* κουμπιά */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--paper);padding:8px 15px;border-radius:11px;cursor:pointer;font-weight:500;font-size:.9rem;text-decoration:none;color:var(--ink);transition:.15s;min-height:40px;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.pri:hover{opacity:.9}
.btn.soft{background:var(--lilac);border-color:transparent;color:var(--ink)}
.btn.yel{background:var(--yellow);border-color:transparent;color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;min-height:32px;font-size:.83rem;border-radius:9px}
.btn.lg{min-height:48px;padding:12px 22px;font-size:1rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--line2);font-size:.78rem;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.chip.l{background:var(--lilac)}.chip.y{background:var(--yellow)}.chip.p{background:var(--pink)}.chip.b{background:var(--blue)}.chip.pe{background:var(--peach)}.chip.m{background:var(--mint)}
.chip.ok{background:var(--mint);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
button.chip{border:0;cursor:pointer}
/* φόρμες */
label.f{display:block;font-size:.83rem;color:var(--ink2);margin-bottom:5px;font-weight:500}
.in{width:100%;border:1px solid var(--line);background:var(--field);border-radius:11px;padding:9px 12px;outline:none;transition:.15s;min-height:42px;color:var(--ink)}
.in:focus{border-color:var(--lilac-d);box-shadow:0 0 0 3px var(--lilac)}
textarea.in{min-height:96px;resize:vertical}
.in.sm{min-height:34px;padding:5px 10px;font-size:.86rem;width:auto;border-radius:9px}
.field{margin-bottom:14px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:.92rem;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--lilac-d);flex:none}
.switch{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.switch:last-child{border-bottom:0}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:.2s}
.switch input:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--lilac-d)}
.switch input:checked:after{left:21px}
.switch b{display:block;font-weight:500;font-size:.94rem}.switch small{color:var(--ink2);font-size:.8rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{position:relative;flex:1;min-width:200px}
.toolbar .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.toolbar .search input{padding-left:38px}
.toolbar select.in{width:auto;min-width:0;max-width:100%}
/* σημειώσεις */
.note{background:var(--yellow);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--ink)}
.note.l{background:var(--lilac)}.note.b{background:var(--blue)}.note.p{background:var(--pink)}
.warnbox{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--yellow) 60%,var(--paper));padding:10px 12px;border-radius:10px;font-size:.88rem}
.okbox{border-left:3px solid var(--ok);background:var(--mint);padding:10px 12px;border-radius:10px;font-size:.88rem}
.banner2{display:flex;align-items:center;gap:10px;background:var(--lilac);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}
.banner2 .grow{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;font-size:.92rem;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;white-space:pre-wrap}
@media(max-width:620px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:44px;color:var(--ink2);text-align:center}

}

.wcbg i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:radial-gradient(circle at 40% 40%,var(--wc1),transparent 70%);animation:wc1 46s ease-in-out infinite alternate}
.wcbg i:nth-child(2){width:60vmax;height:60vmax;right:-22vmax;top:15vh;background:radial-gradient(circle at 50% 50%,var(--wc2),transparent 65%);animation:wc2 58s ease-in-out infinite alternate}
.wcbg i:nth-child(3){width:65vmax;height:65vmax;left:5vw;bottom:-30vmax;background:radial-gradient(circle at 50% 50%,var(--wc3),transparent 65%);animation:wc3 52s ease-in-out infinite alternate}
.wcbg i:nth-child(4){width:40vmax;height:40vmax;left:35vw;top:30vh;background:radial-gradient(circle,var(--wc1),transparent 60%);opacity:.3;animation:wc2 70s ease-in-out infinite alternate-reverse}

 .rw.wrapm{flex-wrap:wrap}.rw.wrapm .grow{flex:1 1 0}.rw.wrapm .end{width:100%;justify-content:flex-end;padding-left:0;margin-top:4px}}

.qamt{font-family:var(--head);font-size:1.6rem;font-weight:700;margin-top:4px}
.rcpt{white-space:pre-wrap;font-family:var(--font);font-size:.86rem;line-height:1.55;max-height:42vh;overflow:auto}
.finlock{display:flex;align-items:center;gap:12px;padding:14px 16px}
/* ---- Ραντεβού ---- */
.daychips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:14px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
.dchip span{font-size:.72rem;color:var(--ink2)}.dchip b{font-size:1.05rem}.dchip small{font-size:.62rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dchip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}.dchip.on span,.dchip.on small{color:inherit;opacity:.85}

.appt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:12px;border:1px solid var(--lilac-d);background:var(--lilac);color:var(--ink);cursor:pointer;font:inherit;margin-bottom:4px;min-width:0}

.appt .grow{min-width:0;flex:1}.appt b{display:block;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.appt small{display:block;font-size:.72rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wkgrid{display:grid;gap:4px;align-items:stretch;margin-bottom:16px}

.wkt{font-size:.74rem;color:var(--ink3);padding-top:6px;text-align:right;padding-right:4px}
.wkc{min-height:44px;border-radius:10px;background:color-mix(in srgb,var(--paper) 70%,transparent);border:1px dashed var(--line);padding:3px;display:flex;flex-direction:column}

.freeb{flex:1;border:0;background:none;color:var(--ink3);cursor:pointer;border-radius:8px;display:grid;place-items:center;opacity:.35}
.freeb:hover{opacity:1;background:var(--mint);color:var(--mint-d)}
.daylist{display:none}
.hours{display:grid;gap:4px}
.hrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:start;border-bottom:1px solid var(--line2);padding:4px 0}
.ht{font-size:.8rem;color:var(--ink2);padding-top:8px;font-variant-numeric:tabular-nums}
.freeline{width:100%;text-align:left;border:1px dashed var(--mint-d);background:color-mix(in srgb,var(--mint) 55%,transparent);color:var(--mint-d);border-radius:12px;padding:9px 12px;font:inherit;font-size:.84rem;cursor:pointer;display:flex;align-items:center;gap:6px}
@media(max-width:960px){.wkgrid{display:none}.daylist{display:block}}
.stpick{display:flex;flex-wrap:wrap;gap:6px}
.stp{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:.85rem;cursor:pointer;color:var(--ink)}

.stp.on{background:var(--lilac);border-color:var(--lilac-d);font-weight:600}
.actgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actgrid .btn{justify-content:center}
.agtoday .aglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.agfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:12px;font-size:.88rem;color:var(--ink2)}
.agfoot span{display:inline-flex;align-items:center;gap:6px}.agfoot .btn{margin-left:auto}
/* ---- βοήθεια «!» ---- */
.hlp{display:inline-grid;place-items:center;width:19px;height:19px;padding:0;margin-left:6px;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:var(--ink3);font:800 11px/1 var(--font);cursor:pointer;vertical-align:.18em;opacity:.75;flex:none;letter-spacing:0}
.hlp:hover{opacity:1;color:var(--lilac-d)}

.stu .hlp{color:inherit;opacity:.6}
.helpl{display:grid;gap:10px;margin-top:12px}
.helpi{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--line2)}
.helpi b{font-size:.9rem}.helpi span{font-size:.85rem;color:var(--ink2);line-height:1.45}
/* ---- Ραντεβού: μήνας και χρονογραμμή ---- */
.agbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-bottom:10px}
.aglegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--ink2);margin-bottom:12px}
.aglegend span{display:inline-flex;align-items:center;gap:5px}.aglegend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid transparent}
.aglegend i.live{background:var(--lilac-d)}.aglegend i.active{background:var(--lilac);border-color:var(--lilac-d)}.aglegend i.done{background:var(--mint);border-color:var(--mint-d)}.aglegend i.absent{background:var(--line2);border-color:var(--line)}.aglegend i.once{background:var(--peach);border-color:var(--peach-d)}
.mgrid{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mwd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.mwd span{text-align:center;font-size:.74rem;font-weight:700;color:var(--ink2);padding:8px 0}
.mdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mday{display:flex;flex-direction:column;gap:4px;min-height:104px;padding:6px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);color:var(--ink);min-width:0}
.mday:nth-child(7n){border-right:0}
.mday.out{opacity:.45}.mday.off{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line2) 6px 8px)}
.mday.sel{box-shadow:inset 0 0 0 2px var(--lilac-d)}.mday:hover{background:color-mix(in srgb,var(--lilac) 40%,transparent)}
.mtop{display:flex;align-items:center;justify-content:space-between}
.mtop b{font-size:.86rem;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.mday.today .mtop b{background:var(--ink);color:var(--on-ink)}
.mcount{font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--line2);color:var(--ink2)}
.mcount.act{background:var(--lilac-d);color:#fff}
.hbar{display:flex;gap:1px;height:7px;border-radius:4px;overflow:hidden}
.hbar i{flex:1;background:color-mix(in srgb,var(--mint) 80%,transparent)}
.hbar i.h1{background:var(--lilac-d);opacity:.55}.hbar i.h2{background:var(--lilac-d);opacity:.8}.hbar i.h3{background:var(--lilac-d)}
.mev{display:flex;flex-direction:column;gap:2px;min-width:0}
.mchip{font-size:.68rem;line-height:1.25;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--line2);color:var(--ink2)}
.mchip.active{background:var(--lilac);color:var(--ink);box-shadow:inset 3px 0 0 var(--lilac-d)}
.mchip.live{background:var(--lilac-d);color:#fff;font-weight:700}
.mchip.done{background:var(--mint);color:var(--mint-d)}.mchip.absent{text-decoration:line-through;opacity:.6}
.mmore{font-size:.66rem;color:var(--ink3);padding-left:4px}
@media(max-width:700px){.mday{min-height:62px;padding:4px}.mev{display:none}.mtop b{font-size:.8rem}}
.tl{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:8px 8px 10px;margin-bottom:16px}
.tl-head,.tl-body{display:grid;grid-template-columns:48px repeat(var(--cols),minmax(0,1fr));gap:4px}
.tl-dh{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:10px;color:var(--ink)}
.tl-dh span{font-size:.72rem;color:var(--ink2)}.tl-dh b{font-size:1rem}
.tl-dh.today{background:var(--lilac)}.tl-dh.off{opacity:.5}
.tl-body{position:relative;margin-top:6px}
.tl-times{position:relative}.tl-times span{position:absolute;right:4px;transform:translateY(-50%);font-size:.7rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.tl-col{position:relative;border-radius:8px;background:color-mix(in srgb,var(--mint) 22%,transparent);cursor:copy}
.tl-col.off{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line2) 6px 8px);cursor:default}
.tl-col.today{background:color-mix(in srgb,var(--lilac) 30%,transparent)}
.tl-line{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.tl-ev{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 6px;border-radius:9px;border:1px solid var(--line);background:var(--line2);color:var(--ink);font:inherit;text-align:left;cursor:pointer;overflow:hidden;z-index:1;min-width:0}
.tl-ev b{font-size:.78rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.tl-ev small{font-size:.68rem;color:var(--ink2);white-space:nowrap}
.tl-ev.active{background:var(--lilac);border-color:var(--lilac-d);box-shadow:inset 4px 0 0 var(--lilac-d)}
.tl-ev.k-once.active{background:var(--peach);border-color:var(--peach-d);box-shadow:inset 4px 0 0 var(--peach-d)}
.tl-ev.live{background:var(--lilac-d);border-color:var(--lilac-d);color:#fff;z-index:2;box-shadow:0 0 0 3px color-mix(in srgb,var(--lilac-d) 30%,transparent);animation:livep 2s infinite}
.tl-ev.live small{color:#fff;opacity:.9}
.tl-ev.done{background:var(--mint);border-color:var(--mint-d)}.tl-ev.absent{opacity:.55;text-decoration:line-through}.tl-ev.past{opacity:.7}
.tl-now{position:absolute;left:-4px;right:0;border-top:2px solid var(--bad);z-index:3;pointer-events:none}
.tl-now::before{content:"";position:absolute;left:-2px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
@keyframes livep{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--lilac-d) 12%,transparent)}}
.appt.live{background:var(--lilac-d);color:#fff;border-color:var(--lilac-d)}.appt.live small{color:#fff}
@media(max-width:960px){.tl[style*="--cols:7"] .tl-ev b{font-size:.66rem}.tl[style*="--cols:7"] .tl-ev small{display:none}}
/* 2.10.2 — καταστάσεις, κουμπιά ενεργειών */
.actgrid .btn{white-space:normal;line-height:1.2;text-align:center;min-height:52px;padding:8px 10px;flex-wrap:nowrap}
.actgrid .btn svg,.actgrid .btn .icw{flex:none}
.actgrid .btn span{min-width:0;overflow-wrap:anywhere}
.btn.came{background:var(--paper);border:1.5px dashed var(--ok);color:var(--ok);font-weight:600}
.btn.came:hover{background:color-mix(in srgb,var(--ok) 10%,var(--paper));border-style:solid}
.btn.okout{background:var(--mint);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);font-weight:600}
.stbox{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-radius:12px;margin:10px 0 12px;font-size:.88rem;line-height:1.35;border:1px solid transparent}
.stbox svg{flex:none;margin-top:1px}.stbox .small{margin-top:3px;font-weight:400}
.stbox.ok{background:#E3F4EA;border-color:#A9D9BC;color:#2F7550}
.stbox.bad{background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad)}
.stbox.gray{background:var(--line2);border-color:var(--line);color:var(--ink2)}
:root{--donebg:#E3F4EA;--donebd:#9FD3B4;--donetx:#2F7550;--cxbg:#FBE6E3;--cxbd:#EBB2AB;--cxtx:#B4483F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--donebg:#1F3A2B;--donebd:#3E7A58;--donetx:#9FE0BA;--cxbg:#3D2224;--cxbd:#7A3B37;--cxtx:#F2A39B}}
:root[data-theme="dark"]{--donebg:#1F3A2B;--donebd:#3E7A58;--donetx:#9FE0BA;--cxbg:#3D2224;--cxbd:#7A3B37;--cxtx:#F2A39B}
.tl-ev.done,.appt.done{background:var(--donebg)!important;border-color:var(--donebd)!important;color:var(--donetx);box-shadow:inset 4px 0 0 var(--donebd)!important;opacity:1}
.tl-ev.cancel,.appt.cancel{background:var(--cxbg)!important;border-color:var(--cxbd)!important;color:var(--cxtx);box-shadow:inset 4px 0 0 var(--cxbd)!important;opacity:.85}
.tl-ev.cancel b,.appt.cancel b{text-decoration:line-through}
.tl-ev.done small,.tl-ev.cancel small,.appt.done small,.appt.cancel small{color:inherit;opacity:.85}
.mchip.done{background:var(--donebg);color:var(--donetx)}
.mchip.cancel{background:var(--cxbg);color:var(--cxtx);text-decoration:line-through}
.aglegend i.done{background:var(--donebg);border-color:var(--donebd)}.aglegend i.cancel{background:var(--cxbg);border-color:var(--cxbd)}
/* 2.10.3 — πληρότητα ημέρας, βελάκια ώρας */
.dchip.ld,.tl-dh.ld,.mday.ld{position:relative;isolation:isolate;overflow:hidden}
.dchip.ld::before,.tl-dh.ld::before,.mday.ld::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--ld);background:color-mix(in srgb,var(--lc) 38%,transparent);z-index:-1;transition:height .3s}
.mday.ld::before{background:color-mix(in srgb,var(--lc) 22%,transparent)}
.dchip.ld-full,.tl-dh.ld-full{background:color-mix(in srgb,var(--bad) 32%,var(--paper));border-color:var(--bad)}
.mday.ld-full{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bad) 60%,transparent)}
.dchip.ld.on::before{background:color-mix(in srgb,var(--lc) 70%,transparent)}
.dchip.ld.on.ld-full{background:var(--bad);border-color:var(--bad)}
.dchip .ldt,.tl-dh .ldt{font-size:.6rem;font-weight:600;color:var(--ink2);white-space:nowrap}
.dchip.on .ldt{color:inherit}
.tl-dh{display:flex;flex-direction:column;align-items:center}
.tstep{position:relative;display:block}
.tstep input{padding-right:40px;width:100%}
.tsb{position:absolute;right:3px;top:3px;bottom:3px;display:flex;flex-direction:column;width:32px;border-left:1px solid var(--line)}
.tsb button{flex:1;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--ink2);cursor:pointer;padding:0;border-radius:6px;min-height:0}
.tsb button:hover,.tsb button:active{background:var(--lilac);color:var(--ink)}
.tstep input::-webkit-calendar-picker-indicator{margin-right:2px}
.dchip.ld-full:not(.on) span,.dchip.ld-full:not(.on) small,.tl-dh.ld-full span,.tl-dh.ld-full small{color:var(--ink);opacity:1}
.dchip .ldt::after,.tl-dh .ldt::after{content:" ώ";font-weight:400}
/* λωρίδα ημερών μήνα */
.dstrip-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dstrip-h .dsm{font-weight:600;min-width:120px;text-align:center}
.dstrip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 8px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.dstrip .dchip{flex:0 0 62px;scroll-snap-align:center;position:relative}
.dstrip .dchip.wk{margin-left:8px}.dstrip .dchip.wk:first-child{margin-left:0}
.dstrip .dchip.pastd:not(.on){opacity:.6}
.dchip .dn{position:absolute;top:4px;right:5px;font-style:normal;font-size:.6rem;font-weight:700;background:var(--lilac-d);color:#fff;border-radius:8px;min-width:15px;height:15px;line-height:15px;padding:0 3px}
.dchip small.fr{color:var(--ok);font-weight:600}.dchip.on small.fr{color:inherit}
.dstat{margin:-2px 0 12px}
/* προσωπικό */
.pvbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.pvf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px 5px 5px;font-size:.84rem;cursor:pointer;color:var(--ink);white-space:nowrap;flex:none}
.pvf small{color:var(--ink3);font-size:.7rem}
.pvf i,.pvtag i,.pvb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-style:normal;font-size:.7rem;font-weight:700;flex:none}
.pvf[data-pvf=""]{padding-left:10px}
.pvf.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}.pvf.on small{color:inherit;opacity:.75}
.pvtag{display:inline-flex;align-items:center;gap:4px;margin-right:6px;font-weight:600}.pvtag i{width:16px;height:16px;font-size:.58rem}
.tl-ev .pvb{position:absolute;top:3px;right:3px;width:16px;height:16px;font-size:.58rem}
.staffrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.staffrow:last-child{border-bottom:0}
.staffrow .pvb{width:34px;height:34px;font-size:.9rem}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches label{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatches input{display:none}.swatches label:has(input:checked){border-color:var(--paper);box-shadow:0 0 0 2px var(--ink)}
.capbox{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--lilac);margin-top:12px;font-size:.9rem}
/* κλειστές μέρες / αργίες */
.dchip.closed,.tl-dh.closed{background:var(--cxbg)!important;border-color:var(--cxbd)!important;opacity:1!important}
.dchip.closed span,.dchip.closed b,.dchip.closed small,.tl-dh.closed span,.tl-dh.closed b{color:var(--cxtx)!important}
.dchip.closed.on{box-shadow:0 0 0 2px var(--cxtx)}

.sitem{margin:12px auto;max-width:320px;text-align:center;font-size:1.5rem;font-weight:800;background:#fff;color:#2E2A33;border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.12);animation:drop .35s}
.sbtns{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.oline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0 14px;min-height:46px}
.oline i{font-style:normal;opacity:.5}
.oslot{min-width:54px;min-height:40px;border-radius:10px;border:2px dashed rgba(46,42,51,.25);display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;font-weight:700}

.otiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.otiles .opt{flex:0 1 auto;min-width:64px}
.otiles .opt.used{opacity:.25}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:300px;margin:16px auto;padding:10px}
.spad{aspect-ratio:1;border-radius:26px;border:0;font-size:2.6rem;cursor:pointer;opacity:.55;transition:transform .12s,opacity .12s,box-shadow .12s}
.sp0{background:#F6B3AE}.sp1{background:#F8E08E}.sp2{background:#A9DDBF}.sp3{background:#A9C8F0}
.spad.lit{opacity:1;transform:scale(1.07);box-shadow:0 0 0 6px rgba(255,255,255,.9),0 0 28px rgba(255,255,255,.9)}.spad:disabled{cursor:default}
.nlwrap{padding:18px 18px 40px}.nlq{text-align:center;font-size:1.3rem;margin-bottom:58px;color:#2E2A33}
.nline{position:relative;height:56px;cursor:crosshair;margin:0 14px}
.nline:before{content:"";position:absolute;left:0;right:0;top:26px;height:5px;border-radius:3px;background:#2E2A33}
.nlt{position:absolute;top:38px;font-weight:700;transform:translateX(-50%);color:#2E2A33}.nlt.l{left:0}.nlt.r{left:100%}.nlt.m{left:50%}
.nline:after{content:"";position:absolute;left:0;right:0;top:20px;height:17px;background:repeating-linear-gradient(90deg,#2E2A33 0 2px,transparent 2px 10%);opacity:.5}
.nlhero{position:absolute;top:-34px;left:-30px;font-style:normal;font-size:1.8rem;transform:translateX(-50%);transition:left .6s}
.nlmark{position:absolute;top:-6px;transform:translateX(-50%);font-size:.72rem;font-weight:800;padding:2px 6px;border-radius:6px;white-space:nowrap}
.nlmark.you{background:#FBEBC9;color:#7A5A10;top:44px}.nlmark.ans{background:#D6F2E1;color:#245C40;top:-4px}
.bal{position:relative;height:150px;margin:10px auto;max-width:360px}
.beam{position:absolute;left:5%;right:5%;top:40px;height:8px;background:#6B5A3E;border-radius:4px;transition:transform .6s;transform-origin:center}
.pan{position:absolute;top:8px;width:42%;display:flex;justify-content:center}.pan.l{left:0}.pan.r{right:0}
.pan span{background:#fff;color:#2E2A33;border-radius:12px;padding:10px 12px;font-weight:800;font-size:1.15rem;box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateY(-100%)}
.fulc{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:60px solid #8A7553}
.badges .badge{border:2px solid transparent;font:inherit;font-size:.8rem;color:inherit;cursor:pointer;line-height:1.25}
.badge.bronze{border-color:#E3B58C}.badge.silver{border-color:#C9CED6}.badge.gold{border-color:#E8C04A;box-shadow:0 0 0 3px rgba(232,192,74,.18)}
.badge.award{border-color:#B9A6E8}.badge.off{border-color:transparent}
.mdhead{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin-bottom:14px}.mdhead .small{grid-column:2}
.mdcount{grid-row:span 2;text-align:center;background:#fff;border-radius:18px;padding:8px 14px}.mdcount b{display:block;font-size:1.8rem;line-height:1}.mdcount span{font-size:.72rem}
.mdbar{height:10px;border-radius:6px;background:rgba(255,255,255,.7);overflow:hidden}.mdbar i{display:block;height:100%;background:linear-gradient(90deg,#F2B544,#E9774E);border-radius:6px}.mdbar.sm{height:7px;margin-top:4px}
.mdnext{background:rgba(255,255,255,.75);border-radius:18px;padding:12px;margin-bottom:12px}.mdn{display:flex;gap:10px;align-items:center;margin-top:8px}.mdn .e{font-size:1.8rem}.mdn .grow{flex:1;min-width:0}
.mdt{margin:16px 0 8px;font-family:inherit;font-size:1rem}
.mdpop{position:fixed;inset:0;z-index:3000;background:rgba(30,25,40,.45);display:grid;place-items:center;padding:20px;animation:drop .25s}
.mdcard{background:#fff;color:#2E2A33;border-radius:26px;padding:22px;max-width:340px;width:100%;text-align:center;border:4px solid #eee}
.mdcard.bronze{border-color:#E3B58C}.mdcard.silver{border-color:#C9CED6}.mdcard.gold{border-color:#E8C04A}
.mdcard .big{font-size:5rem;line-height:1.1;margin:8px 0}.mdcard .big.off{filter:grayscale(1);opacity:.4}.mdcard h3{margin:4px 0;font-family:inherit}
.mdpop.new .big{animation:mdpop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes mdpop{from{transform:scale(.2) rotate(-20deg)}to{transform:none}}

body{background:#fff}.wsheet{page-break-after:always;box-shadow:none;border:0}

/* ===== Ημερολόγιο: ταυτότητα — καθαρό, δροσερό χαρτί και το χρώμα του επαγγέλματος ===== */
:root{--brand:#17324D;--on-brand:#fff;--brand-txt:#17324D;--brand-d:#112538;--brand-soft:#E3E8EE;--brand-soft2:#F0F3F6;
  --cream:#F2F4F8;--paper:#FFFFFF;--field:#FFFFFF;--raise:#F8F9FB;--ink:#15202E;--ink2:#5A6678;--ink3:#8D97A6;--line:#E1E5EC;--line2:#EDF0F4;
  --lilac-d:var(--brand-txt);--lilac:var(--brand-soft);--head:var(--font);--sh:0 1px 2px rgba(21,32,46,.05),0 6px 20px rgba(21,32,46,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#11161D;--paper:#19202A;--field:#1F2733;--raise:#1C2430;--ink:#E8EDF3;--ink2:#A7B1BE;--ink3:#7D8896;--line:#2A3340;--line2:#232B36;
  --lilac:color-mix(in srgb,var(--brand) 30%,#19202A);--lilac-d:color-mix(in srgb,var(--brand) 55%,#fff)}}
h1,h2,h3{font-family:var(--font);font-weight:800;letter-spacing:-.015em}
h1{font-size:1.55rem}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-d)}
a{color:var(--lilac-d)}
.brand svg,.tbrand svg{border-radius:10px}
.side-ver{margin-top:auto;padding:10px 12px}
.side .nav a.on{background:var(--brand);color:var(--on-brand)}
.side .nav a.on .ic{color:var(--on-brand)}

/* μπάρα κορυφής στο κινητό: γεμάτο χρώμα */
.topbar{background:var(--brand);border-bottom:0;color:var(--on-brand);backdrop-filter:none;-webkit-backdrop-filter:none;gap:10px;height:auto;min-height:56px;padding-top:env(safe-area-inset-top,0px)}
.topbar .tbrand{flex:none}.topbar .tbrand svg{width:30px;height:30px;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.tbtitle{flex:1;font-size:1.12rem;font-weight:800;letter-spacing:-.01em}
.tbprof{font-size:.8rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
@media (min-width:961px){.topbar{display:none}}
@media (max-width:960px){.side{display:none}.main{padding-top:18px;padding-bottom:120px}}

/* κάτω πλοήγηση + κουμπί προσθήκης */
.bottomnav a.on{color:var(--brand-txt)}
.bottomnav a.on .bi{background:var(--brand-soft);color:var(--brand-txt)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:55;width:60px;height:60px;border-radius:20px;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 10px 24px color-mix(in srgb,var(--brand) 45%,transparent);cursor:pointer}
.fab:active{transform:scale(.96)}
@media (min-width:961px){.fab{bottom:28px;right:32px}}

/* «Σήμερα» */
.hero{position:relative;overflow:hidden;background:var(--brand);color:var(--on-brand);border-radius:24px;padding:22px 22px 24px;margin-bottom:16px;display:flex;align-items:flex-end}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>svg{position:absolute;right:18px;top:18px;width:46px;height:46px;border-radius:13px;opacity:.95;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.hero-in{position:relative;z-index:1}
.hero-hi{font-size:.95rem;opacity:.85}
.hero-date{font-size:clamp(1.9rem,8vw,2.6rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;margin:4px 0 10px}
.hero-sum{font-size:1rem;opacity:.95}.hero-sum b{font-size:1.15rem}
.nextcard{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:18px;padding:14px 14px 14px 12px;box-shadow:var(--sh);cursor:pointer;color:var(--ink);font:inherit}
.nextcard.live{border-left-color:#E0A100;background:color-mix(in srgb,#E0A100 7%,var(--paper))}
.nc-time{display:flex;flex-direction:column;align-items:center;min-width:62px;padding-right:12px;border-right:1px solid var(--line)}
.nc-time b{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;color:var(--brand-txt)}.nc-time small{color:var(--ink2)}
.nextcard.live .nc-time b{color:#B07E00}
.nc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nc-main small{font-size:.78rem;font-weight:700;color:var(--brand-txt)}
.nextcard.live .nc-main small{color:#B07E00}
.nc-main b{font-size:1.1rem}.nc-main span{color:var(--ink2);font-size:.9rem}
.ncact{display:flex;gap:8px;margin:10px 0 4px}.ncact .btn{flex:1;justify-content:center}
.tsec{margin-top:22px}
.tsec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.tsec-h h2{margin:0;font-size:1.05rem}.tsec-h a{font-size:.88rem;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:2px}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:stretch;gap:10px}
.tr-t{width:46px;flex:none;font-weight:800;font-size:.95rem;padding-top:12px;color:var(--ink)}
.trow .appt{flex:1;margin:0}
.trow.past .tr-t,.trow.done .tr-t{color:var(--ink3)}
.trow.past .appt{opacity:.6}
.tempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 16px;background:var(--paper);border:1.5px dashed var(--line);border-radius:18px;color:var(--ink2)}
.tempty .ic{color:var(--brand)}.tempty b{color:var(--ink);font-size:1.05rem}.tempty .btn{margin-top:8px}
.chipt.free{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok);font-weight:700}
.tmrw{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.demobar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,#E0A100 14%,var(--paper));border:1px solid color-mix(in srgb,#E0A100 40%,var(--line));border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:.9rem}
.instcard{display:flex;align-items:center;gap:12px;margin-top:24px;background:var(--brand-soft2);border:1px solid var(--brand-soft);border-radius:18px;padding:14px}
.instcard>svg{width:42px;height:42px;border-radius:12px;flex:none}
.instcard b{display:block}.instcard span{font-size:.85rem;color:var(--ink2)}

/* ημερολόγιο: στο κινητό μόνο τα βασικά — τα υπόλοιπα στο «Περισσότερα» */
@media (max-width:960px){
  #agNew,#agBlk,#agCfg,#agPdf{display:none}
  .agbar #agRem,.agbar #agWait,.agbar #agCopyW,.agbar #agLock{display:none}
  main>.aglegend,#main .aglegend,#main .kpis.kmini{display:none}
  .legendbox .aglegend{display:flex!important}
  .page-head{margin-bottom:12px;display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .page-head .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .page-head h1{font-size:1.25rem}
  .page-head>div:first-child{flex:1}
  .page-head .actions{flex-wrap:nowrap}
}
.legendbox{margin-top:14px}
.appt.live .av{background:#fff;color:var(--brand)}
.hero{min-height:150px}
.agbar .seg a.on{background:var(--brand);color:var(--on-brand)}

/* επιλογή επαγγέλματος: πλακίδια με εικονίδιο, ομαδοποιημένα με το χρώμα της κατηγορίας */
.pgrp{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:var(--ink);margin:18px 2px 8px}
.pgrp i{width:10px;height:10px;border-radius:3px;flex:none}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);cursor:pointer;color:var(--ink);font:inherit;text-align:center;min-height:104px}
.ptile .pti{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--gc) 14%,var(--paper))}
.ptile .ptn{font-size:.8rem;font-weight:600;line-height:1.25}
.ptile:hover{border-color:var(--gc)}
.ptile.on{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 8%,var(--paper));box-shadow:0 0 0 2px color-mix(in srgb,var(--gc) 30%,transparent)}
.ptile.on .pti{background:var(--gc)}
.fr-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}.fr-head svg{width:48px;height:48px;border-radius:13px;flex:none}
.frdemo{display:flex;gap:8px;align-items:flex-start;margin:6px 0 4px;font-size:.92rem}
.rprow.rpnew{border-style:dashed}
.search{display:flex;align-items:center;gap:8px}.search .in{flex:1}
.scols.big button{width:38px;height:38px}
/* ρυθμίσεις */
.setlist{display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none}
.setrow:hover{border-color:var(--brand)}
.setrow b{display:block}.setrow small{color:var(--ink2);font-size:.82rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow .grow,.bkcard>summary .grow{flex:1;min-width:0}
.seti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--brand-soft);flex:none}
.setback{display:inline-flex;align-items:center;gap:4px;font-size:.9rem;font-weight:600;text-decoration:none;margin-bottom:10px}
.kindseg{display:flex;gap:6px}.kindseg button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer;color:var(--ink)}
.kindseg button.on{border-color:var(--brand);background:var(--brand-soft)}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.thgrid button{aspect-ratio:1;border-radius:12px;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;color:#fff}
.thgrid button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px}
.conpick{width:100%;justify-content:center;border-style:dashed}
.bkcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.bkcard>summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none}
.bkcard>summary::-webkit-details-marker{display:none}
.bkcard>summary small{display:block;color:var(--ink2);font-size:.82rem}
.bkcard[open]>summary{margin-bottom:10px}
.bkic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--brand-soft);flex:none}
.bkdanger .bkic{background:var(--badbg)}
.btn.wide{width:100%;justify-content:center}
.howto{padding-left:20px;margin:8px 0}.howto li{margin-bottom:6px}
.instpop{text-align:center;padding:6px 4px}.instpop svg{width:64px;height:64px;border-radius:18px;margin:4px auto 10px;display:block}
.actgrid{gap:10px}
.actgrid .btn{justify-content:flex-start;text-align:left;gap:12px;min-height:62px;padding:8px 14px 8px 10px;font-size:.95rem;line-height:1.18}
.actgrid .btn>span{flex:1;min-width:0}
.actgrid .btn .ic{flex:none}
.actgrid .btn:last-child:nth-child(odd){grid-column:1/-1;justify-content:center}
.actgrid .btn:last-child:nth-child(odd)>span{flex:0 1 auto}
@media (prefers-reduced-motion:reduce){.fab:active{transform:none}}
</style>
